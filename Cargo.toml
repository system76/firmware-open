[workspace]
resolver = "3"
members = [
    "tools/modeltool",
    "tools/xtask",
]
exclude = [
    "apps/firmware-setup",
    "apps/firmware-update",
    "apps/gop-policy",
    "ec/tools",
    "tools/coreboot-collector",
    "tools/intel-spi",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false
repository = "https://github.com/system76/firmware-open"
rust-version = "1.85.0"

[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "derive"] }
redox_intelflash = "0.1.3"
system76_ecflash = "0.1.3"

[workspace.lints.rust]

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
